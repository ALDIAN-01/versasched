<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head-links}">
    <meta charset="UTF-8">
    <title>Mi cuenta | Dilash</title>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container-cliente">

    <!-- Flash messages -->
    <div th:if="${exito}" class="alert alert-success d-flex align-items-center gap-2 mb-4 alert-dismissible fade show">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 mb-4 alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tarjeta de perfil -->
    <div class="card p-4 mb-4">
        <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="avatar-circle">
                    <span th:text="${#strings.substring(usuario.nombre,0,1)}">U</span>
                </div>
                <div>
                    <h5 class="mb-0 fw-bold" th:text="'Hola, ' + ${usuario.nombre} + ' ' + ${usuario.apellido} + ' 👋'">Hola</h5>
                    <p class="text-muted mb-0 small" th:text="${usuario.correo}">correo</p>
                    <p class="text-muted mb-0 small">
                        <i class="bi bi-telephone me-1"></i>
                        <span th:text="${usuario.telefono}">tel</span>
                    </p>
                </div>
            </div>
            <a href="/perfil" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1 flex-shrink-0">
                <i class="bi bi-pencil-square"></i> Editar perfil
            </a>
        </div>
    </div>

    <!-- Encabezado citas -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h5 class="mb-0 fw-bold">Mis citas</h5>
        <a href="/agendar" class="btn btn-gold btn-sm px-3 d-flex align-items-center gap-1">
            <i class="bi bi-plus-lg"></i> Agendar nueva cita
        </a>
    </div>

    <!-- Sin citas -->
    <div th:if="${#lists.isEmpty(citas)}" class="card p-5 text-center">
        <i class="bi bi-calendar-x text-muted mb-3 icon-empty-state"></i>
        <p class="text-muted mb-3">Aún no tienes citas agendadas.</p>
        <a href="/agendar" class="btn btn-gold btn-sm px-4 mx-auto">Agenda tu primera cita</a>
    </div>

    <!-- Con citas -->
    <div th:unless="${#lists.isEmpty(citas)}">
        <div class="card p-3 mb-3 cita-card" th:each="cita : ${citas}">
            <div class="d-flex justify-content-between align-items-start gap-2">
                <div class="flex-grow-1">

                    <!-- Fecha y hora -->
                    <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
                        <span class="fw-bold" th:text="${#temporals.format(cita.fecha,'dd/MM/yyyy')}">fecha</span>
                        <span class="text-muted">•</span>
                        <span class="text-muted small">
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${cita.horario?.hora}">hora</span>
                        </span>
                    </div>

                    <!-- Lugar -->
                    <p class="mb-1 small text-muted" th:if="${cita.lugar != null}">
                        <i class="bi bi-geo-alt me-1"></i>
                        <span th:text="${cita.lugar}"></span>
                        <span th:if="${cita.direccionServicio != null and cita.direccionServicio != 'Local Dilash'}"
                            th:text="' — ' + ${cita.direccionServicio}"></span>
                    </p>

                    <!-- Observaciones -->
                    <p class="mb-1 small text-muted"
                    th:if="${cita.observaciones != null and !cita.observaciones.isBlank()}">
                        <i class="bi bi-chat-left-text me-1"></i>
                        <span th:text="${cita.observaciones}"></span>
                    </p>

                    <!-- Servicios solicitados -->
                    <div class="mb-1" th:if="${cita.detalles != null and !cita.detalles.isEmpty()}">
                        <span class="small text-muted"><i class="bi bi-scissors me-1"></i>Servicios:</span>
                        <span th:each="d, iterStat : ${cita.detalles}" class="small fw-semibold">
                            <span th:text="${d.servicio.nombre}"></span><span th:unless="${iterStat.last}">, </span>
                        </span>
                    </div>

                    <!-- Total -->
                    <p class="mb-0 fw-semibold small cell-total">
                        <i class="bi bi-tag me-1"></i>
                        Total: $<span th:text="${#numbers.formatInteger(cita.total,0,'POINT')}">0</span>
                    </p>
                </div>

                <!-- Derecha: badge -->
                <div class="d-flex flex-column align-items-end">

                    <!-- Badge estado -->
                    <span class="badge"
                        th:text="${cita.estado.nombre}"
                        th:classappend="${cita.estado.nombre == 'Agendada'}   ? 'bg-warning text-dark' :
                                        (${cita.estado.nombre == 'Realizada'} ? 'bg-success'           : 'bg-danger')">
                    </span>

                </div>
            </div>
        </div>
    </div>

    <!-- Nota informativa -->
    <p class="text-muted text-center small mt-3" th:unless="${#lists.isEmpty(citas)}">
        <i class="bi bi-info-circle me-1"></i>
        ¿Necesitas cancelar o reagendar? Escríbenos por
        <a href="https://wa.me/573024813620" target="_blank" class="text-danger-link">WhatsApp</a>
        para coordinar.
    </p>
</div>

<style>
/* Estilos específicos que necesitan ser inline por limitaciones de Thymeleaf */
.cita-card {
    padding: 1.2rem;
    border-radius: 12px;
    transition: box-shadow 0.2s;
}</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
