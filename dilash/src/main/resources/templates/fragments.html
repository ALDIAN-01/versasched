<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head-links">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --gold-dark: #B8860B; }
        body { background-color: #f8f5f0; font-family: 'Montserrat', sans-serif; }
        .btn-gold { background-color: var(--gold); color: white; border: none; }
        .btn-gold:hover { background-color: var(--gold-dark); color: white; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .navbar-brand { color: var(--gold) !important; font-weight: bold; font-size: 1.5rem; letter-spacing: 2px; }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">DILASH</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" href="/#servicios">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" href="/#faq">FAQ</a></li>
                <li class="nav-item" th:if="${session.usuarioLogueado == null}">
                    <a class="nav-link" href="/login">Iniciar sesión</a>
                </li>
                <li class="nav-item" th:if="${session.usuarioLogueado == null}">
                    <a class="btn btn-gold btn-sm px-3" href="/registro">Registrarse</a>
                </li>
                <li class="nav-item dropdown" th:if="${session.usuarioLogueado != null}">
                    <button class="nav-link dropdown-toggle d-flex align-items-center gap-1 btn btn-link p-0" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle"></i>
                        <span th:text="${session.usuarioLogueado.nombre}">Usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li th:if="${session.usuarioLogueado.tipoUsuario == 'ADMIN'}">
                            <a class="dropdown-item" href="/admin"><i class="bi bi-speedometer2 me-2"></i>Panel Admin</a>
                        </li>
                        <li th:if="${session.usuarioLogueado.tipoUsuario != 'ADMIN'}">
                            <a class="dropdown-item" href="/cliente"><i class="bi bi-calendar-check me-2"></i>Mis citas</a>
                        </li>
                        <li th:if="${session.usuarioLogueado.tipoUsuario != 'ADMIN'}">
                            <a class="dropdown-item" href="/perfil"><i class="bi bi-pencil-square me-2"></i>Editar perfil</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
