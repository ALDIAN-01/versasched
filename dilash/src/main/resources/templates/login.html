<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dilash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --gold-dark: #B8860B; }
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('/img/hero.jpg') no-repeat center/cover fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            padding: 1rem;
        }
        .auth-card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-card .brand {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 3px;
            text-align: center;
            display: block;
            margin-bottom: 0.25rem;
        }
        .auth-card .subtitle {
            text-align: center;
            color: #999;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        .form-control {
            border-radius: 8px;
            border: 1.5px solid #e0e0e0;
            padding: 0.65rem 1rem;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.15); }
        .form-control.is-invalid { border-color: #dc3545; }
        .invalid-feedback { font-size: 0.78rem; }
        .btn-gold {
            background: var(--gold);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        .btn-gold:hover { background: var(--gold-dark); color: white; transform: translateY(-1px); }
        .input-group-text { background: #fafafa; border: 1.5px solid #e0e0e0; border-radius: 0 8px 8px 0; cursor: pointer; }
        .input-group .form-control { border-radius: 8px 0 0 8px; border-right: none; }
        .input-group .form-control:focus + .input-group-text { border-color: var(--gold); }
        @media (max-width: 480px) { .auth-card { padding: 2rem 1.25rem; } }
    </style>
</head>
<body>

<div class="auth-card">
    <span class="brand">DILASH</span>
    <p class="subtitle">Bienvenida de vuelta</p>

    <form method="post" action="/login" id="loginForm" novalidate>

        <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:0.85rem;">Correo electrónico</label>
            <input type="email" name="correo" id="correo" class="form-control"
                   placeholder="tu@correo.com" required autocomplete="email">
            <div class="invalid-feedback">Ingresa un correo válido con @.</div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold" style="font-size:0.85rem;">Contraseña</label>
            <div class="input-group">
                <input type="password" name="contrasena" id="contrasena" class="form-control"
                       placeholder="••••••••" required minlength="4" autocomplete="current-password">
                <span class="input-group-text" onclick="togglePass('contrasena', this)">
                    <i class="bi bi-eye"></i>
                </span>
            </div>
            <div class="invalid-feedback d-block" id="contrasenaError" style="display:none!important;"></div>
        </div>

        <div class="mb-3" th:if="${error}">
            <div class="alert alert-danger py-2 text-center" style="font-size:0.85rem;">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:text="${error}"></span>
            </div>
        </div>

        <button type="submit" class="btn-gold mb-3">Ingresar</button>
        <input type="hidden" name="redirect" th:value="${param.redirect}">
    </form>

    <div class="text-center">
        <small class="text-muted">¿No tienes cuenta? <a href="/registro" style="color:var(--gold);font-weight:600;">Regístrate</a></small>
    </div>
</div>

<script>
function togglePass(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
    let valid = true;
    const correo = document.getElementById('correo');
    const contrasena = document.getElementById('contrasena');

    // Validar correo
    if (!correo.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo.value)) {
        correo.classList.add('is-invalid');
        valid = false;
    } else {
        correo.classList.remove('is-invalid');
    }

    // Validar contraseña
    if (!contrasena.value || contrasena.value.length < 4) {
        contrasena.classList.add('is-invalid');
        document.getElementById('contrasenaError').style.display = 'block';
        document.getElementById('contrasenaError').textContent = 'La contraseña es requerida.';
        valid = false;
    } else {
        contrasena.classList.remove('is-invalid');
        document.getElementById('contrasenaError').style.display = 'none';
    }

    if (!valid) e.preventDefault();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
