# ── Conexión SQL Server ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DilashDB_Test;encrypt=true;trustServerCertificate=true
spring.datasource.username=Aldian
spring.datasource.password=Aldian_Admin#2026
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Dialecto explícito para SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ── Recursos estáticos ────────────────────────────────────────────────────────
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8081
