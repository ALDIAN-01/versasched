# ── Conexión SQL Server ───────────────────────────────────────────────────────
# Mantén los mismos valores que tenías; no hay cambio de credenciales.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DilashDB_Test;encrypt=true;trustServerCertificate=true
spring.datasource.username=Aldian
spring.datasource.password=Aldian_Admin#2026
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# IMPORTANTE: cambiado de 'update' a 'validate'.
# Con 'update' Hibernate intentaría re-crear columnas o alterar tablas que ya
# creaste con dilash-clean.sql, lo que puede generar conflictos o duplicados.
# Con 'validate' solo comprueba que el esquema coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Dialecto explícito para SQL Server (evita warnings en Spring Boot 3+)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ── Recursos estáticos ────────────────────────────────────────────────────────
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8081
